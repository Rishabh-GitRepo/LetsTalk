services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8
    restart: unless-stopped
    volumes:
      - redis_data:/data

  auth-service:
    build:
      context: ..
      dockerfile: apps/auth-service/Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env.production
    depends_on:
      - postgres
      - redis

  gateway:
    build:
      context: ..
      dockerfile: apps/gateway/Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env.production
    depends_on:
      - auth-service

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - gateway

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
